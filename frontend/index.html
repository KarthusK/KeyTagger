<!DOCTYPE html>

    <!-- 浏览器地址栏/移动端状态栏跟随主题（与 styles.css 的 --bg 同值） -->

    <meta name="theme-color" content="#131716" media="(prefers-color-scheme: dark)" />

    />
    <title>KeyTagger - 游戏键位可视化编辑工具</title>
  </head>
